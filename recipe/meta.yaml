{% set name = "stripe" %}
{% set version = "16.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5016068d54aebb43e61b3c377ef45bede4e0b4eb1817d7a12af81630c55a23d2
  patches:
    - patches/0001-use-certifi-ca-bundle.patch

build:
  number: 1
  script: |
    # Remove the vendored CA bundle before the build proceeds so that the certificates don'tags
    # accidentally get vendored in.
    rm -f stripe/data/ca-certificates.crt  # [unix]
    if exist stripe\data\ca-certificates.crt del /f /q stripe\data\ca-certificates.crt  # [win]
    {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - flit-core >=3.11,<4
  run:
    - python
    - certifi >=2026.10.19
    - typing-extensions >=4.7.0
    - requests >=2.20

test:
  source_files:
    - tests
  imports:
    - stripe
    - stripe._account
    - stripe._any_iterator
    - stripe._api_mode
    - stripe._api_requestor
    - stripe._api_resource
    - stripe._api_version
    - stripe._app_info
    - stripe._application_fee
    - stripe._base_address
    - stripe._charge
    - stripe._client_options
    - stripe._createable_api_resource
    - stripe._custom_method
    - stripe._customer
    - stripe._deletable_api_resource
    - stripe._encode
    - stripe._error
    - stripe._error_object
    - stripe._event
    - stripe._expandable_field
    - stripe._file
    - stripe._http_client
    - stripe._invoice
    - stripe._list_object
    - stripe._listable_api_resource
    - stripe._multipart_data_generator
    - stripe._nested_resource_class_methods
    - stripe._oauth
    - stripe._oauth_service
    - stripe._person
    - stripe._request_metrics
    - stripe._request_options
    - stripe._requestor_options
    - stripe._search_result_object
    - stripe._searchable_api_resource
    - stripe._singleton_api_resource
    - stripe._stripe_client
    - stripe._stripe_context
    - stripe._stripe_object
    - stripe._stripe_response
    - stripe._stripe_service
    - stripe._test_helpers
    - stripe._transfer
    - stripe._updateable_api_resource
    - stripe._util
    - stripe._v1_services
    - stripe._v2_services
    - stripe._verify_mixin
    - stripe._version
    - stripe._webhook
    - stripe.billing._meter
    - stripe.events
    - stripe.oauth_error
  requires:
    - pip
    - pytest
    - anyio
  commands:
    - pip check
    # Offline CA bundle tests (added by the certifi patch). The rest of the suite needs stripe-mock.
    - pytest -v --nomock tests/test_http_client.py -k test_ca_bundle
    - python -c "import os, stripe; assert not os.path.exists(os.path.join(os.path.dirname(stripe.__file__), 'data', 'ca-certificates.crt'))"
    # INTERNALERROR> urllib3.exceptions.NewConnectionError: HTTPConnection(host='localhost', port=12111): Failed to establish a new connection: [Errno 61] Connection refused
    # - pytest -v tests

about:
  home: https://github.com/stripe/stripe-python
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: The Stripe Python library provides convenient access to the Stripe API from applications written in the Python language.
  description: |
    The Stripe Python library provides convenient access to the Stripe API from applications written in the Python language.
    It includes a pre-defined set of classes for API resources that initialize themselves dynamically from API
    responses which makes it compatible with a wide range of versions of the Stripe API.
  doc_url: https://docs.stripe.com/api?lang=python
  dev_url: https://github.com/stripe/stripe-python

extra:
  recipe-maintainers:
    - nehaljwani
